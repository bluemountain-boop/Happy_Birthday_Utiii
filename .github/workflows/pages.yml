name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble website files
        run: |
          mkdir -p site/src/models site/src/Stiker
          cp index.html memories.html jar.html letter.html finale.html styles.css script.js favicon.svg site/
          cp -R src/aud src/img src/vid site/src/
          cp src/models/nailong-optimized.glb site/src/models/
          cp src/Stiker/4.png src/Stiker/6.png src/Stiker/7.png src/Stiker/8.png site/src/Stiker/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
